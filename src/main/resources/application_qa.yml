server:
  port: 8082

keys:
  ssl:
    enabled: false
    keyStore: ${ITEM_SSL_KEYSTORE:/opt/apps/.secure/scc-hybrid-chat-dev.antontech.co.za.jks}
    keyStorePassword: ${ITEM_SSL_KEYSTORE_PASSWORD:change-me}
    trustStore: ${ITEM_SSL_TRUSTSTORE:/opt/apps/.secure/cacerts}
    trustStorePassword: ${ITEM_SSL_TRUSTSTORE_PASSWORD:changeit}

spring:
  application:
    name: item-kafka-producer-poc
  datasource:
    url: ${ITEM_MSSQL_URL:jdbc:sqlserver://SQLSERVER01\\DEVINSTANCE:1433;databaseName=CS_Demo_Central_Master_Data;integratedSecurity=true;encrypt=false}
    driver-class-name: ${ITEM_DATASOURCE_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mysql:
    jdbcUrl: ${ITEM_MYSQL_URL:jdbc:mysql://localhost:3306/CS_Demo_Central_Master_Data?useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${ITEM_MYSQL_USERNAME:root}
    password: ${ITEM_MYSQL_PASSWORD:change-me}
  kafka:
    bootstrap-servers: ${ITEM_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        request.timeout.ms: 120000
        retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: item_group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      max-poll-interval-ms: 300000
      session-timeout-ms: 45000
      manual-consumer:
        group-id: manual-item-group
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto-offset-reset: earliest
        properties:
          max.poll.interval.ms: 60000

flink:
  jobmanager:
    web:
      address: 0.0.0.0
    rpc:
      address: localhost
    memory:
      heap:
        size: 2048m
      process:
        size: 2048m
  taskmanager:
    memory:
      heap:
        size: 2048m
      task:
        heap:
          size: 1024m
      managed:
        size: 512m
      process:
        size: 2048m
      network:
        memory:
          fraction: 0.1
          min: 64mb
          max: 1gb
    numberOfTaskSlots: 2
  parallelism:
    default: 2
  metrics:
    enabled: false

logging:
  config:
    classpath: logback-spring.xml
  file:
    name: logs/${spring.application.name}_${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd}.log
  level:
    root: INFO
    com.antontech.itemkafka_poc: INFO
    com.antontech.itemkafka_poc.controller: INFO
    com.antontech.itemkafka_poc.kafka.consumer: INFO
    com.antontech.itemkafka_poc.kafka.producer: INFO
    com.antontech.itemkafka_poc.service: INFO
    org:
      springframework:
        kafka: INFO
        web: INFO
      apache:
        http: INFO
    httpclient:
      wire: INFO

gateway:
  endpoint:
    url: ${ITEM_GATEWAY_URL:http://localhost:8081/item-kafka/app/send-items/v1}

jwt:
  private-key: ${ITEM_JWT_PRIVATE_KEY:}
  issuer: ${ITEM_JWT_ISSUER:item-kafka-producer}
  expiry-minutes: ${ITEM_JWT_EXPIRY_MINUTES:30}

springdoc:
  swagger-ui:
    path: /agent/swagger-ui.html

syslog:
  logging:
    port: 514
    facility: local7
    host: ${SYSLOG_HOST:172.18.65.175}
    level: INFO
    pattern: '%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}} ${LOG_LEVEL_PATTERN:%5p} [%c:%L] %msg %ex'
    rolling:
      file: ./logs/${spring.application.name}_%d{yyyy-MM-dd-HH}.log.gz
      file.max.history: 7
      file.max.size: 100MB
