spring:
  application:
    name: item-kafka-producer-poc
  datasource:
    url: jdbc:sqlserver://C21SQL04\AMOS.1:1433;databaseName=CS_Caissa_Central_Master_Data;integratedSecurity=true;encrypt=false
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    # No username & password needed for integrated security
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mysql:
    jdbcUrl: jdbc:mysql://localhost:3306/cs_caissa_central_master_data?useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Anton@Perfect07
#  sqlserver:
#    jdbcUrl: jdbc:sqlserver://C21SQL04\\AMOS.1:1433;databaseName=CS_Caissa_Central_Master_Data;encrypt=false
#  restartStrategy:
#    strategy: fixed-delay  # Use fixed-delay strategy
#    attempts: 3  # Number of retry attempts
#    delay: 10s  # Delay between retry attempts
  kafka:
    bootstrap-servers: localhost:9092 # Replace with your Kafka broker details
    producer:
      properties:
        request.timeout.ms: 120000  # 120 seconds timeout for requests
        retries: 3                   # Number of retries for failed sends
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer  # Use StringSerializer
    consumer:
      group-id: item_group # Main consumer group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      max-poll-interval-ms: 300000  # Adjust to 5 minutes
      session-timeout-ms: 45000      # Keep this as needed
      # enable-auto-commit: false  # Only if using manual acknowledgment
      #properties:
      # Add any additional consumer properties here if needed (e.g., security settings)
      manual-consumer: # Configuration for the manual consumer
        group-id: manual-item-group # manual consumer group id
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto-offset-reset: earliest
        properties:
          max.poll.interval.ms: 60000  # Increase to 60 seconds (adjust as needed)

flink:
  jobmanager:
    web:
      address: 0.0.0.0  # Allow access from all network interfaces
    rpc:
      address: localhost  # RPC address
    memory:
      heap:
        size: 2048m  # JobManager Heap Memory
      process:
        size: 2048m  # Total JVM Process Memory for JobManager
  taskmanager:
    memory:
      heap:
        size: 2048m  # TaskManager Heap Memory
      task:
        heap:
          size: 1024m  # Specific size for task heap memory
      managed:
        size: 512m  # Managed memory size for Flink tasks
      process:
        size: 2048m  # Total JVM Process Memory for TaskManager
      network:
        memory:
          fraction: 0.1  # Fraction for network buffers
          min: 64mb  # Minimum network memory for TaskManagers
          max: 1gb  # Maximum network memory for TaskManagers
    numberOfTaskSlots: 2
  parallelism:
    default: 2  # Default parallelism for Flink jobs
  metrics:
    enabled: false  # Set to true to enable metrics
    reporter:
    # Configure any reporters here (e.g., Prometheus, Grafana, etc.)
    # e.g.,
    # Prometheus:
    #  enabled: true
    #  port: 9249 # Disable metrics if not required for local tests

logging:
  config:
    classpath: logback-spring.xml
  file:
    name: logs/${NAME:ef-hello_world-agent-poc}_%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd}}.log
  level:
    root: DEBUG  # This will set the logging level to DEBUG for all classes
    za.co.woolworths.itemkafka_poc: DEBUG  # Capture DEBUG logs for your parent package
    za.co.woolworths.itemkafka_poc.controller: DEBUG # Setting DEBUG level for the entire controller package
    za.co.woolworths.itemkafka_poc.kafka.consumer: DEBUG # Setting DEBUG level for the entire kafka consumer package
    za.co.woolworths.itemkafka_poc.kafka.producer: DEBUG # Setting DEBUG level for the entire kafka producer package
    za.co.woolworths.itemkafka_poc.consumer: DEBUG  # Setting DEBUG level for the entire consumer package
    za.co.woolworths.itemkafka_poc.producer: DEBUG  # Setting DEBUG level for the entire consumer package
    za.co.woolworths.itemkafka_poc.service: DEBUG # Setting DEBUG level for the entire service package
    org:
      springframework:
        kafka: DEBUG
        web: DEBUG
        ws:
          client:
            MessageTracing:
              sent: DEBUG
              received: DEBUG
          server:
            MessageTracing:
              sent: DEBUG
              received: DEBUG
      apache:
        http: DEBUG
    httpclient:
      wire: DEBUG

gateway:
  endpoint:
    # The following endpoint is what you will add to call another endpoint from this app via intermediary SSL layer - for that enable SSL also
    url: 'http://localhost:8081/item-kafka/app/send-items/v1'

